<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ffb8d9; padding: 6px 12px; }
  caption { font-weight: bold; padding-bottom: 8px; }
  thead th { background: #ffcde4; }
  tfoot { background: #ffcde4; font-weight: bold; }
</style>
<body>
    <table>
  <caption>Pedidos da semana</caption>
  <thead>
    <tr>
      <th scope="col">Produto</th>
      <th scope="col">Qtd.</th>
      <th scope="col">Valor</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Caderno</td>
      <td>3</td>
      <td>R$ 45,00</td>
    </tr>
    <tr>
      <td>Caneta</td>
      <td>10</td>
      <td>R$ 25,00</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <th scope="row">Total</th>
      <td>13</td>
      <td>R$ 70,00</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
