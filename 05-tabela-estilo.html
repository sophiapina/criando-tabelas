<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Jogadores</title>
</head>
<body>
    <style>
  table {
    border-collapse: collapse;
    width: 100%;
    font-family: sans-serif;
  }
  th, td {
    border: 1px solid #d8d8d0;
    padding: 10px 14px;
    text-align: left;
  }
  thead th {
    background: #272822;
    color: #f8f8f2;
  }
  tbody tr:nth-child(even) {
    background: #f4f4ee;
  }
  tbody tr:hover {
    background: #fdf6c8;
  }
  .num {
    text-align: right;
  }
</style>

<table>
  <thead>
    <tr>
      <th>Jogador</th>
      <th class="num">Pontos</th>
      <th class="num">Vitórias</th>
    </tr>
  </thead>
  <tbody>
    <tr><td>Lia</td><td class="num">1.250</td><td class="num">18</td></tr>
    <tr><td>Rafa</td><td class="num">1.180</td><td class="num">16</td></tr>
    <tr><td>Duda</td><td class="num">960</td><td class="num">12</td></tr>
    <tr><td>Caio</td><td class="num">870</td><td class="num">11</td></tr>
  </tbody>
</table>
</body>
</html>
